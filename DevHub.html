<style>

:root[data-theme="light"]{--bg:#f6f9fc;--panel:#fff;--line:#dbe4ee;--tx:#0d1a26;--mut:#56677a;--ac:#007c99;--acx:#fff}
:root[data-theme="dark"]{--bg:#0a0e14;--panel:#111822;--line:#1f2a38;--tx:#e6edf5;--mut:#8696a8;--ac:#00D4FF;--acx:#00131a}
html{scroll-padding-top:70px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.m,code,input.m,textarea{font-family:"JetBrains Mono","Fira Code",ui-monospace,Consolas,monospace}
a{color:var(--ac)}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:-.02em;text-decoration:none;color:var(--tx)}.logo b{color:var(--ac)}

.sp{flex:1}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
main{max-width:1100px;margin:auto;padding:28px 16px 80px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.05;letter-spacing:-.03em;margin:.2em 0 .3em;max-width:16em}
h2{font-size:22px;margin:0 0 14px;letter-spacing:-.01em}.lead{color:var(--mut);max-width:42em}
.hero-s{display:flex;gap:10px;margin:22px 0;max-width:620px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:15px;word-break:break-word}.card p{margin:0;color:var(--mut);font-size:13px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips button{border-radius:99px}.chips .on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.fav{margin-left:auto;background:none;border:0;cursor:pointer;font-size:18px;color:var(--mut)}.fav.on{color:var(--ac)}
.sk{height:118px;border-radius:8px;background:linear-gradient(90deg,var(--panel),var(--line),var(--panel));background-size:200% 100%;animation:sk 1.2s infinite}

.tools label{font-size:12px;color:var(--mut);display:block;margin:8px 0 3px}

.out{margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:6px;min-height:36px;word-break:break-all;font-size:13px}
.sw{height:34px;border-radius:6px;border:1px solid var(--line);margin-top:8px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.warn{border:1px solid var(--ac);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.wrap{overflow-x:auto}
.sec{display:none}.sec.on{display:block}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:10px;width:min(560px,92vw);padding:14px;top:12vh}

dialog input{width:100%}.res a{display:block;padding:7px 8px;border-radius:6px;color:var(--tx);text-decoration:none}.res a:hover,.res a:focus{background:var(--bg)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
footer{border-top:1px solid var(--line);padding:18px 16px;text-align:center;color:var(--mut);font-size:13px}

function y(o,i=0){const p="  ".repeat(i);if(Array.isArray(o))return o.map(v=>p+"- "+(typeof v=="object"?"\n"+y(v,i+1):v)).join("\n");if(o&&typeof o=="object")return Object.entries(o).map(([k,v])=>typeof v=="object"&&v?p+k+":\n"+y(v,i+1):p+k+": "+v).join("\n");return p+o}
$("#j_i").addEventListener("input",()=>{try{$("#j_o").textContent=y(JSON.parse($("#j_i").value))}catch(e){$("#j_o").textContent="⚠ "+e.message}});$("#j_i").dispatchEvent(new Event("input"));
$("#z_i").addEventListener("input",e=>{const d=new Date(e.target.value);if(isNaN(d))return;$("#z_o").textContent=["UTC","Europe/Berlin","Europe/Moscow","America/New_York","Asia/Tokyo"].map(z=>z+": "+d.toLocaleString(L,{timeZone:z})).join("\n")});
const FX={USD:1,EUR:.92,GBP:.79,RUB:92,JPY:150,CNY:7.2};["x_f","x_t"].forEach((id,i)=>{$("#"+id).innerHTML=Object.keys(FX).map(x=>`<option>${x}</option>`).join("");$("#"+id).selectedIndex=i});
function fx(){$("#x_o").textContent=(+$("#x_v").value/FX[$("#x_f").value]*FX[$("#x_t").value]).toFixed(2)+" "+$("#x_t").value}["x_v","x_f","x_t"].forEach(i=>$("#"+i).addEventListener("input",fx));fx();
/* i18n, theme, routing, search */
function i18n(){document.documentElement.lang=L;$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$$("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));$("#lang").textContent=L=="ru"?"EN":"RU";cats();renderRepos()}
$("#lang").onclick=()=>{L=L=="ru"?"en":"ru";try{localStorage.setItem("l",L)}catch{}i18n()};
$("#theme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#0a0e14";r.dataset.theme=d?"light":"dark";try{localStorage.setItem("th",r.dataset.theme)}catch{}};
try{const th=localStorage.getItem("th");document.documentElement.dataset.theme=th||"dark"}catch{document.documentElement.dataset.theme="dark"}
function route(){const p=(location.hash.replace("#/","")||"home").split("/")[0];$$(".sec").forEach(s=>s.classList.toggle("on",s.id=="s-"+p));$$("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#/"+(p=="home"?"":p)));scrollTo(0,0)}
addEventListener("hashchange",route);
$("#hgo").onclick=()=>{$("#q").value=$("#hq").value;location.hash="#/github";renderRepos()};$("#hq").addEventListener("keydown",e=>e.key=="Enter"&&$("#hgo").click());
const dlg=$("#dlg");function gs(){const q=$("#gq").value.toLowerCase();const items=[...repos.filter(r=>r.n.toLowerCase().includes(q)).slice(0,5).map(r=>[r.n,"https://github.com/"+r.n]),...LG.filter(l=>l[0].toLowerCase().includes(q)).map(l=>[l[0],"https://"+l[1]]),...tl.filter(x=>x[0].toLowerCase().includes(q)).map(x=>[x[0],"#/tools"])];$("#gres").innerHTML=items.slice(0,8).map(([n,u])=>`<a href="${u}" ${u[0]=="h"?'target="_blank" rel="noopener"':''}>${esc(n)}</a>`).join("")||`<p class="lead">${t("none")}</p>`}
$("#gq").addEventListener("input",gs);$("#gres").addEventListener("click",()=>dlg.close());
const open=()=>{dlg.showModal();$("#gq").focus();gs()};$("#sbtn").onclick=open;
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="k"){e.preventDefault();dlg.open?dlg.close():open()}});

$("#repos").innerHTML=$("#homeTop").innerHTML=Array(6).fill('<div class="sk"></div>').join("");
langs();i18n();route();
